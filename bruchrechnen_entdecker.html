<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruch-Entdecker Studio</title>
  
  <!-- React und ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel für JSX-Kompilierung im Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS für das Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons via ESM -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS für Animationen -->
  <style>
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .animate-fall {
      animation: fall 2.5s linear forwards;
    }
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-slow {
      animation: bounce-slow 3s ease-in-out infinite;
    }
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-50 via-indigo-50/20 to-teal-50/10 text-slate-800 min-h-screen font-sans antialiased">

  <div id="root"></div>

  <!-- React Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- REPLIKATION DER LUCIDE-ICONS FÜR REINES HTML ---
    // Da wir in reinem HTML sind, bauen wir kleine SVG-Wrapper für die benötigten Icons
    const Icon = ({ name, className = "w-5 h-5" }) => {
      let paths = [];
      let viewBox = "0 0 24 24";
      let fill = "none";
      let strokeWidth = "2";

      switch (name) {
        case "sparkles":
          paths = [
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" />,
            <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5 Z" opacity="0.8" />,
            <path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 Z" opacity="0.8" />
          ];
          break;
        case "star":
          paths = [<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />];
          break;
        case "volume2":
          paths = [
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />,
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />,
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          ];
          break;
        case "volumex":
          paths = [
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />,
            <line x1="22" y1="9" x2="16" y2="15" />,
            <line x1="16" y1="9" x2="22" y2="15" />
          ];
          break;
        case "check":
          paths = [<polyline points="20 6 9 17 4 12" />];
          strokeWidth = "3";
          break;
        case "trophy":
          paths = [
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />,
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />,
            <path d="M4 22h16" />,
            <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34" />,
            <path d="M12 2a6 6 0 0 1 6 6v3.5c0 2.5-2.24 4.5-5 4.5h-2c-2.76 0-5-2-5-4.5V8a6 6 0 0 1 6-6z" />
          ];
          break;
        case "eye":
          paths = [
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />,
            <circle cx="12" cy="12" r="3" />
          ];
          break;
        case "eyeoff":
          paths = [
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />,
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />,
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />,
            <line x1="2" y1="2" x2="22" y2="22" />
          ];
          break;
        case "rotateccw":
          paths = [
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />,
            <polyline points="3 3 3 8 8 8" />
          ];
          break;
        case "chevronup":
          paths = [<polyline points="18 15 12 9 6 15" />];
          break;
        case "chevrondown":
          paths = [<polyline points="6 9 12 15 18 9" />];
          break;
        case "xcircle":
          paths = [
            <circle cx="12" cy="12" r="10" />,
            <line x1="15" y1="9" x2="9" y2="15" />,
            <line x1="9" y1="9" x2="15" y2="15" />
          ];
          break;
        case "info":
          paths = [
            <circle cx="12" cy="12" r="10" />,
            <line x1="12" y1="16" x2="12" y2="12" />,
            <line x1="12" y1="8" x2="12.01" y2="8" />
          ];
          break;
        case "helpcircle":
          paths = [
            <circle cx="12" cy="12" r="10" />,
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />,
            <line x1="12" y1="17" x2="12.01" y2="17" />
          ];
          break;
        case "lightbulb":
          paths = [
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .5 2.5 1.5 3.5.8.8 1.3 1.5 1.5 2.5" />,
            <path d="M9 18h6" />,
            <path d="M10 22h4" />
          ];
          break;
        default:
          paths = [];
      }

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          viewBox={viewBox} 
          fill={fill} 
          stroke="currentColor" 
          strokeWidth={strokeWidth} 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {paths}
        </svg>
      );
    };

    // --- SOUND SYNTHESIZER (Web Audio API) ---
    const playSound = (type, isMuted) => {
      if (isMuted) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        if (type === 'correct') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc1.type = 'sine';
          osc2.type = 'triangle';
          
          osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc1.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc1.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          
          osc2.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc2.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);

          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          
          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.5);
          osc2.stop(ctx.currentTime + 0.5);
        } else if (type === 'incorrect') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);
          
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'fanfare') {
          const notes = [261.63, 329.63, 392.00, 523.25];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.1);
            osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
          });
        }
      } catch (e) {
        console.log("Audio nicht freigegeben.");
      }
    };

    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return {
        x: centerX + (radius * Math.cos(angleInRadians)),
        y: centerY + (radius * Math.sin(angleInRadians))
      };
    };

    const getWedgePath = (cx, cy, r, startAngle, endAngle) => {
      const start = polarToCartesian(cx, cy, r, endAngle);
      const end = polarToCartesian(cx, cy, r, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return [
        "M", cx, cy,
        "L", start.x, start.y,
        "A", r, r, 0, largeArcFlag, 0, end.x, end.y,
        "Z"
      ].join(" ");
    };

    // --- MODEL GRAFIKEN ---

    const PizzaShape = ({ den, selectedSlices, onSliceClick, interactive, taskId }) => {
      const slices = Array.from({ length: den });
      const sliceAngle = 360 / den;

      return (
        <div className="relative w-44 h-44 sm:w-48 sm:h-48 mx-auto drop-shadow-lg transition-transform hover:scale-105 duration-300">
          <svg viewBox="0 0 100 100" className="w-full h-full overflow-visible">
            <circle cx="50" cy="51.5" r="49" fill="#D97706" opacity="0.15" />
            <circle cx="50" cy="50" r="48" fill="#FDE68A" stroke="#D97706" strokeWidth="1.5" />
            
            {slices.map((_, i) => {
              const startAngle = i * sliceAngle;
              const endAngle = (i + 1) * sliceAngle;
              const isSelected = selectedSlices.includes(i);
              
              const midAngle = startAngle + (sliceAngle / 2);
              const pepPos = polarToCartesian(50, 50, 32, midAngle);
              const pepPos2 = polarToCartesian(50, 50, 18, midAngle - 10);

              return (
                <g key={i} 
                   onClick={() => interactive && onSliceClick(i)}
                   className={interactive ? "cursor-pointer select-none" : "select-none"}
                   style={{ transformOrigin: '50px 50px', transition: 'all 0.2s ease' }}>
                  
                  <path 
                    d={getWedgePath(50, 50, 48, startAngle, endAngle)} 
                    fill={isSelected ? "#FBBF24" : "#FEF3C7"} 
                    stroke="#B45309" 
                    strokeWidth="0.8"
                    className={`transition-colors duration-200 ${interactive ? 'hover:fill-amber-300' : ''}`}
                  />
                  
                  {isSelected && (
                    <g className="animate-in zoom-in duration-200">
                      <path 
                        d={getWedgePath(50, 50, 45, startAngle + 1, endAngle - 1)} 
                        fill="none" 
                        stroke="#EF4444" 
                        strokeWidth="1.5" 
                        opacity="0.8"
                      />
                      <circle cx={pepPos.x} cy={pepPos.y} r="4.5" fill="#DC2626" stroke="#991B1B" strokeWidth="0.4" />
                      <circle cx={pepPos2.x} cy={pepPos2.y} r="2.8" fill="#DC2626" stroke="#991B1B" strokeWidth="0.4" />
                      <circle cx={pepPos.x - 1.5} cy={pepPos.y - 1.5} r="0.8" fill="#FCA5A5" />
                    </g>
                  )}
                </g>
              );
            })}
            <circle cx="50" cy="50" r="46" fill="none" stroke="#D97706" strokeWidth="0.5" strokeDasharray="2,2" opacity="0.4" />
          </svg>
        </div>
      );
    };

    const ChocoShape = ({ den, selectedSlices, onSliceClick, interactive, taskId }) => {
      let cols = 2;
      if (den === 3) cols = 3;
      if (den === 4) cols = 2;
      if (den === 5) cols = 5;
      if (den === 6) cols = 3;
      if (den === 8) cols = 4;
      if (den === 10) cols = 5;
      if (den === 12) cols = 4;
      
      const rows = Math.ceil(den / cols);
      const gap = 2;
      const rectW = (100 - (cols + 1) * gap) / cols;
      const rectH = (100 - (rows + 1) * gap) / rows;
      const slices = Array.from({ length: den });

      return (
        <div className="relative w-44 h-44 sm:w-48 sm:h-48 mx-auto drop-shadow-xl transition-transform hover:scale-105 duration-300">
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <defs>
              <linearGradient id={`chocoGrad-${taskId}`} x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#6D4C41" />
                <stop offset="100%" stopColor="#3E2723" />
              </linearGradient>
              <linearGradient id={`wrapperGrad-${taskId}`} x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#F9FAFB" />
                <stop offset="100%" stopColor="#E5E7EB" />
              </linearGradient>
            </defs>

            <rect x="0" y="2" width="100" height="98" fill="#00000012" rx="4" />
            <rect x="0" y="0" width="100" height="100" fill={`url(#wrapperGrad-${taskId})`} rx="4" stroke="#D1D5DB" strokeWidth="0.5" />
            
            {slices.map((_, i) => {
              const r = Math.floor(i / cols);
              const c = i % cols;
              const x = gap + c * (rectW + gap);
              const y = gap + r * (rectH + gap);
              const isSelected = selectedSlices.includes(i);

              return (
                <g key={i} onClick={() => interactive && onSliceClick(i)} className={interactive ? "cursor-pointer select-none" : "select-none"}>
                  <rect x={x} y={y} width={rectW} height={rectH} fill="#E5E7EB" rx="1.5" stroke="#9CA3AF" strokeWidth="0.5" />
                  <line x1={x + 2} y1={y + 2} x2={x + rectW - 2} y2={y + rectH - 2} stroke="#D1D5DB" strokeWidth="0.5" />
                  
                  <rect 
                    x={x} y={y} width={rectW} height={rectH} 
                    fill={`url(#chocoGrad-${taskId})`} rx="1.5"
                    className={`transition-all duration-300 ${interactive ? 'hover:brightness-110' : ''}`}
                    style={{
                      transform: isSelected ? 'scale(1)' : 'scale(0)',
                      transformOrigin: `${x + rectW/2}px ${y + rectH/2}px`,
                      opacity: isSelected ? 1 : 0
                    }}
                  />
                  {isSelected && (
                    <React.Fragment>
                      <rect x={x + 1.5} y={y + 1.5} width={rectW - 3} height={rectH - 3} fill="none" stroke="#5D4037" strokeWidth="1" />
                      <path d={`M ${x+1.5} ${y+1.5} L ${x+rectW-1.5} ${y+1.5} L ${x+rectW-4} ${y+4} L ${x+4} ${y+4} Z`} fill="#FFFFFF20" />
                    </React.Fragment>
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    const FlowerMeadowShape = ({ den, selectedSlices, onSliceClick, interactive, taskId }) => {
      let cols = Math.ceil(Math.sqrt(den));
      let rows = Math.ceil(den / cols);
      
      const gapX = 100 / (cols + 1);
      const gapY = 100 / (rows + 1);

      const flowers = Array.from({ length: den }).map((_, i) => {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const jitterX = (Math.sin(i * 1.8 + 4) * 2.8);
        const jitterY = (Math.cos(i * 1.8 + 2) * 2.8);
        return {
          x: gapX * (c + 1) + jitterX,
          y: gapY * (r + 1) + jitterY,
          index: i
        };
      });

      return (
        <div className="relative w-44 h-44 sm:w-48 sm:h-48 mx-auto drop-shadow-xl transition-transform hover:scale-105 duration-300">
          <svg viewBox="0 0 110 110" className="w-full h-full overflow-visible">
            <rect x="2" y="2" width="106" height="106" fill="#D1FAE5" rx="20" stroke="#34D399" strokeWidth="1.5" />
            
            <path d="M15,22 Q16,18 18,22" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.4"/>
            <path d="M92,30 Q93,25 95,30" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.4"/>
            <path d="M22,86 Q23,81 25,86" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.4"/>
            <path d="M85,88 Q86,83 88,88" stroke="#10B981" strokeWidth="1" fill="none" opacity="0.4"/>

            {flowers.map((flow) => {
              const isTulip = selectedSlices.includes(flow.index);
              return (
                <g key={flow.index} 
                   onClick={() => interactive && onSliceClick(flow.index)}
                   className={`transition-all duration-200 ${interactive ? 'cursor-pointer hover:scale-110 origin-center select-none' : 'select-none'}`}
                   style={{ transformOrigin: `${flow.x}px ${flow.y}px` }}>
                  
                  <path d={`M ${flow.x} ${flow.y} Q ${flow.x - 2} ${flow.y + 10} ${flow.x} ${flow.y + 15}`} stroke="#047857" strokeWidth="2.5" fill="none" strokeLinecap="round" />
                  <path d={`M ${flow.x - 0.5} ${flow.y + 7} Q ${flow.x - 6} ${flow.y + 5} ${flow.x - 4} ${flow.y + 2}`} fill="#10B981" />

                  {isTulip ? (
                    <g className="animate-in zoom-in duration-200">
                      <circle cx={flow.x} cy={flow.y} r="1.5" fill="#047857" />
                      <path d={`M ${flow.x - 5} ${flow.y - 3} C ${flow.x - 7} ${flow.y + 1} ${flow.x} ${flow.y + 3} ${flow.x} ${flow.y - 2} C ${flow.x} ${flow.y + 3} ${flow.x + 7} ${flow.y + 1} ${flow.x + 5} ${flow.y - 3} Z`} fill="#F43F5E" />
                      <path d={`M ${flow.x - 3} ${flow.y - 5} L ${flow.x} ${flow.y + 1} L ${flow.x + 3} ${flow.y - 5} L ${flow.x + 1.5} ${flow.y - 1} L ${flow.x - 1.5} ${flow.y - 1} Z`} fill="#BE123C" />
                      <circle cx={flow.x - 1.5} cy={flow.y - 1.5} r="0.8" fill="#FFF" opacity="0.6" />
                    </g>
                  ) : (
                    <g className="animate-in zoom-in duration-200">
                      {Array.from({ length: 8 }).map((_, pi) => {
                        const angle = (pi * 45) * Math.PI / 180;
                        const px = flow.x + Math.cos(angle) * 3.8;
                        const py = flow.y + Math.sin(angle) * 3.8;
                        return (
                          <circle key={pi} cx={px} cy={py} r="2.2" fill="#FFFFFF" stroke="#E5E7EB" strokeWidth="0.4" />
                        );
                      })}
                      <circle cx={flow.x} cy={flow.y} r="2.8" fill="#FBBF24" stroke="#D97706" strokeWidth="0.4" />
                    </g>
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    const WaterGlassShape = ({ den, selectedSlices, onSliceClick, interactive, taskId }) => {
      const levels = Array.from({ length: den });
      const glassHeight = 82;
      const glassWidth = 46;
      const bottomY = 96;
      const topY = bottomY - glassHeight;
      const stepHeight = glassHeight / den;

      const maxFilledIndex = selectedSlices.length > 0 ? Math.max(...selectedSlices) : -1;

      const handleLevelClick = (index) => {
        if (!interactive) return;
        onSliceClick(index);
      };

      return (
        <div className="relative w-44 h-44 sm:w-48 sm:h-48 mx-auto drop-shadow-xl transition-transform hover:scale-105 duration-300">
          <svg viewBox="0 0 100 115" className="w-full h-full overflow-visible">
            <defs>
              <linearGradient id={`waterGrad-${taskId}`} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor="#38BDF8" />
                <stop offset="60%" stopColor="#0284C7" />
                <stop offset="100%" stopColor="#0369A1" />
              </linearGradient>
              <linearGradient id={`glassReflection-${taskId}`} x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.4" />
                <stop offset="25%" stopColor="#FFFFFF" stopOpacity="0.1" />
                <stop offset="85%" stopColor="#FFFFFF" stopOpacity="0.0" />
                <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.3" />
              </linearGradient>
            </defs>

            <ellipse cx="50" cy="100" rx="32" ry="6" fill="#CBD5E1" opacity="0.6" />

            {maxFilledIndex >= 0 && (
              <g className="origin-bottom">
                <path 
                  d={`
                    M ${50 - glassWidth/2 + 1.8} ${bottomY - 1.8}
                    L ${50 - glassWidth/2 + (maxFilledIndex + 1) * 0.3} ${bottomY - (maxFilledIndex + 1) * stepHeight}
                    Q 50 ${bottomY - (maxFilledIndex + 1) * stepHeight - 1.8} ${50 + glassWidth/2 - (maxFilledIndex + 1) * 0.3} ${bottomY - (maxFilledIndex + 1) * stepHeight}
                    L ${50 + glassWidth/2 - 1.8} ${bottomY - 1.8}
                    Z
                  `}
                  fill={`url(#waterGrad-${taskId})`}
                />
                {Array.from({ length: Math.min(maxFilledIndex + 3, 5) }).map((_, bIdx) => (
                  <circle 
                    key={bIdx}
                    cx={40 + (bIdx * 6) % 20} 
                    cy={bottomY - 6 - (bIdx * 12) % (stepHeight * (maxFilledIndex + 1))} 
                    r="1.2" 
                    fill="#FFFFFF" 
                    opacity="0.6"
                    className="animate-pulse"
                    style={{ animationDuration: '1.8s' }}
                  />
                ))}
              </g>
            )}

            <path 
              d={`M ${50 - glassWidth/2} ${topY} L ${50 - glassWidth/2 + 2} ${bottomY} Q 50 ${bottomY + 3} ${50 + glassWidth/2 - 2} ${bottomY} L ${50 + glassWidth/2} ${topY}`}
              fill="none" 
              stroke="#94A3B8" 
              strokeWidth="3.5" 
              strokeLinecap="round"
            />
            <ellipse cx="50" cy="topY" rx={glassWidth/2} ry="3.5" fill="none" stroke="#94A3B8" strokeWidth="2" />

            {levels.map((_, i) => {
              const currentY = bottomY - (i + 1) * stepHeight;
              const isFilled = i <= maxFilledIndex;

              return (
                <g key={i} 
                   onClick={() => interactive && handleLevelClick(i)}
                   className={interactive ? "cursor-pointer group select-none" : "select-none"}>
                  
                  <rect 
                    x={15} 
                    y={bottomY - (i + 1) * stepHeight - 2} 
                    width={70} 
                    height={stepHeight + 4} 
                    fill="transparent" 
                  />

                  <line 
                    x1={50 - glassWidth/2 + i * 0.3} 
                    y1={currentY} 
                    x2={50 + glassWidth/2 - i * 0.3} 
                    y2={currentY} 
                    stroke={isFilled ? "#0284C7" : "#94A3B8"} 
                    strokeWidth={isFilled ? "2" : "1"} 
                    strokeDasharray="2,3"
                    className="group-hover:stroke-sky-400 transition-colors"
                  />

                  <circle 
                    cx={50 - glassWidth/2 - 5} 
                    cy={currentY} 
                    r={isFilled ? "3" : "2"} 
                    fill={isFilled ? "#0284C7" : "#64748B"} 
                    className="group-hover:fill-sky-400 transition-colors"
                  />
                </g>
              );
            })}

            <path 
              d={`M ${50 - glassWidth/2 + 2} ${topY + 2.5} L ${50 - glassWidth/2 + 3.8} ${bottomY - 2.5} Q 50 ${bottomY + 1} ${50 + glassWidth/2 - 3.8} ${bottomY - 2.5} L ${50 + glassWidth/2 - 2} ${topY + 2.5} Z`}
              fill={`url(#glassReflection-${taskId})`}
              pointerEvents="none"
            />
          </svg>
        </div>
      );
    };

    const ConfettiExplosion = () => {
      return (
        <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
          {Array.from({ length: 95 }).map((_, i) => (
            <div
              key={i}
              className="absolute w-3.5 h-3.5 rounded-full animate-fall"
              style={{
                left: `${Math.random() * 100}%`,
                top: `-20px`,
                backgroundColor: ['#10B981', '#3B82F6', '#F59E0B', '#EF4444', '#EC4899', '#8B5CF6', '#F43F5E'][Math.floor(Math.random() * 7)],
                animationDelay: `${Math.random() * 0.8}s`,
                transform: `rotate(${Math.random() * 360}deg)`
              }}
            />
          ))}
        </div>
      );
    };

    // --- HAUPTKOMPONENTE ---
    function App() {
      const [tasks, setTasks] = useState([]);
      const [overallSuccess, setOverallSuccess] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [streak, setStreak] = useState(0);

      const stage1Ref = useRef(null);
      const stage2Ref = useRef(null);
      const stage3Ref = useRef(null);

      const generateSingleTask = (index) => {
        const shapes = ['pizza', 'choco', 'meadow', 'glass'];
        const shape = shapes[index % shapes.length];
        
        let type = 'color';
        let den = 4;
        let num = 2;
        let lvl = 1;

        if (index < 9) {
          lvl = 1;
          type = 'color';
          let dens = [2, 3, 4, 5, 6];
          den = dens[index % dens.length];
          num = Math.floor(Math.random() * (den - 1)) + 1;
        } else if (index >= 9 && index < 18) {
          lvl = 2;
          type = 'read';
          let dens = [4, 5, 6, 8];
          den = dens[index % dens.length];
          num = Math.floor(Math.random() * (den - 1)) + 1;
        } else {
          lvl = 3;
          type = Math.random() > 0.5 ? 'color' : 'read';
          let dens = [6, 8, 10, 12];
          if (shape === 'glass') dens = [5, 6, 8, 10];
          den = dens[index % dens.length];
          num = Math.floor(Math.random() * (den - 1)) + 1;
        }

        let initialSelectedSlices = [];
        if (type === 'read') {
          if (shape === 'glass') {
            initialSelectedSlices = Array.from({ length: num }, (_, i) => i);
          } else if (shape === 'meadow' && lvl === 3) {
            while (initialSelectedSlices.length < num) {
              let r = Math.floor(Math.random() * den);
              if (!initialSelectedSlices.includes(r)) initialSelectedSlices.push(r);
            }
          } else {
            initialSelectedSlices = Array.from({ length: num }, (_, i) => i);
          }
        }

        return {
          id: index + 1,
          level: lvl,
          type,
          shape,
          den,
          num,
          selectedSlices: initialSelectedSlices,
          inputNum: '',
          inputDen: '',
          status: 'idle',
          feedbackMsg: '',
          isCollapsed: index === 0 ? false : true,
          showHint: false
        };
      };

      const initAllTasks = () => {
        const list = [];
        for (let i = 0; i < 27; i++) {
          list.push(generateSingleTask(i));
        }
        setTasks(list);
        setOverallSuccess(false);
      };

      useEffect(() => {
        initAllTasks();
      }, []);

      const handleResetWorksheet = () => {
        initAllTasks();
        playSound('fanfare', isMuted);
      };

      const handleSliceClick = (taskId, sliceIdx) => {
        setTasks(prev => prev.map(t => {
          if (t.id !== taskId) return t;
          if (t.status === 'correct') return t;

          let updatedSlices = [...t.selectedSlices];
          if (t.shape === 'glass') {
            const currentMax = updatedSlices.length > 0 ? Math.max(...updatedSlices) : -1;
            if (currentMax === sliceIdx) {
              updatedSlices = [];
            } else {
              updatedSlices = Array.from({ length: sliceIdx + 1 }, (_, index) => index);
            }
          } else {
            if (updatedSlices.includes(sliceIdx)) {
              updatedSlices = updatedSlices.filter(idx => idx !== sliceIdx);
            } else {
              updatedSlices.push(sliceIdx);
            }
          }

          return {
            ...t,
            selectedSlices: updatedSlices,
            status: 'idle',
            feedbackMsg: ''
          };
        }));
      };

      const handleMassSelect = (taskId, action) => {
        setTasks(prev => prev.map(t => {
          if (t.id !== taskId) return t;
          if (t.status === 'correct') return t;

          let updatedSlices = [];
          if (action === 'all') {
            updatedSlices = Array.from({ length: t.den }, (_, idx) => idx);
          }

          return {
            ...t,
            selectedSlices: updatedSlices,
            status: 'idle',
            feedbackMsg: ''
          };
        }));
      };

      const checkIndividualTask = (taskId) => {
        let playedCorrect = false;
        let playedIncorrect = false;

        setTasks(prev => prev.map(t => {
          if (t.id !== taskId) return t;

          let isCorrect = false;
          let msg = '';

          if (t.type === 'color') {
            if (t.selectedSlices.length === t.num) {
              isCorrect = true;
              msg = 'Großartig gelöst! 🎉';
              playedCorrect = true;
            } else if (t.selectedSlices.length < t.num) {
              const diff = t.num - t.selectedSlices.length;
              msg = `Zähle noch einmal! Dir fehlen noch ${diff} Stückchen.`;
              playedIncorrect = true;
            } else {
              const diff = t.selectedSlices.length - t.num;
              msg = `Ups, das sind ${diff} Stückchen zu viel!`;
              playedIncorrect = true;
            }
          } else {
            const parsedNum = parseInt(t.inputNum, 10);
            const parsedDen = parseInt(t.inputDen, 10);

            if (isNaN(parsedNum) || isNaN(parsedDen)) {
              playedIncorrect = true;
              return {
                ...t,
                status: 'incorrect',
                feedbackMsg: 'Bitte trage sowohl Zähler als auch Nenner ein!'
              };
            }

            if (parsedNum === t.num && parsedDen === t.den) {
              isCorrect = true;
              msg = 'Super gemacht! Das stimmt! ✨';
              playedCorrect = true;
            } else if (parsedDen !== t.den) {
              msg = `Schau den Nenner (unten) an. Zähle ALLE Stücke insgesamt.`;
              playedIncorrect = true;
            } else if (parsedNum !== t.num) {
              msg = `Fast! Der Nenner stimmt. Zähle die markierten Teile für den Zähler (oben).`;
              playedIncorrect = true;
            } else {
              msg = 'Leider noch nicht ganz richtig.';
              playedIncorrect = true;
            }
          }

          return {
            ...t,
            status: isCorrect ? 'correct' : 'incorrect',
            feedbackMsg: msg,
            showHint: false
          };
        }));

        if (playedCorrect) {
          playSound('correct', isMuted);
        } else if (playedIncorrect) {
          playSound('incorrect', isMuted);
        }
      };

      const toggleCollapse = (taskId) => {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            return { ...t, isCollapsed: !t.isCollapsed };
          }
          return t;
        }));
      };

      const toggleHint = (taskId) => {
        setTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            return { ...t, showHint: !t.showHint };
          }
          return t;
        }));
      };

      const expandAll = () => {
        setTasks(prev => prev.map(t => ({ ...t, isCollapsed: false })));
      };

      const collapseAll = () => {
        setTasks(prev => prev.map(t => ({ ...t, isCollapsed: true })));
      };

      const scrollToRef = (ref) => {
        if (ref && ref.current) {
          ref.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      const correctCount = tasks.filter(t => t.status === 'correct').length;

      const progressStufe1 = tasks.filter(t => t.level === 1 && t.status === 'correct').length;
      const progressStufe2 = tasks.filter(t => t.level === 2 && t.status === 'correct').length;
      const progressStufe3 = tasks.filter(t => t.level === 3 && t.status === 'correct').length;

      useEffect(() => {
        if (tasks.length > 0 && correctCount === tasks.length) {
          setOverallSuccess(true);
          setStreak(prev => prev + 1);
          playSound('fanfare', isMuted);
        }
      }, [correctCount, tasks.length]);

      const getModelLabel = (shape) => {
        switch (shape) {
          case 'pizza': return { text: "Kreis-Modell", color: "bg-amber-100 text-amber-800" };
          case 'choco': return { text: "Rechteck-Modell", color: "bg-orange-100 text-orange-950" };
          case 'meadow': return { text: "Mengen-Modell", color: "bg-emerald-100 text-emerald-800" };
          case 'glass': return { text: "Skala-Modell", color: "bg-sky-100 text-sky-800" };
          default: return { text: "Modell", color: "bg-gray-100" };
        }
      };

      const getDidacticHint = (t) => {
        const isColor = t.type === 'color';
        switch (t.shape) {
          case 'pizza':
            return isColor 
              ? `Du siehst insgesamt ${t.den} Stücke. Klicke auf genau ${t.num} davon, um sie zu belegen.`
              : `Zähle die rot belegten Stücke (Zähler). Zähle danach ALLE Stücke insgesamt (Nenner).`;
          case 'choco':
            return isColor
              ? `Klicke auf leere Fächer, um sie mit brauner Schokolade zu füllen. Du sollst ${t.num} von insgesamt ${t.den} Behältern füllen.`
              : `Zähle die gefüllten braunen Behälter (Zähler). Zähle alle Behälter zusammen, um den Nenner (unten) zu erhalten.`;
          case 'meadow':
            return isColor
              ? `Verwandle Margeriten in Tulpen. Am Ende müssen genau ${t.num} der ${t.den} Blumen Tulpen sein!`
              : `Zähle die Tulpen (Zähler). Alle Blumen auf der Wiese zusammen ergeben den Nenner.`;
          case 'glass':
            return isColor
              ? `Klicke auf die ${t.num}. Linie von unten, um das Glas zu füllen.`
              : `Zähle, bis zu welchem Strich das Wasser steht (Zähler). Der oberste Rand ist der Nenner (${t.den}).`;
          default:
            return "";
        }
      };

      const getTaskPrompt = (t) => {
        const isColor = t.type === 'color';
        const numDisplay = <span className="text-indigo-600 inline-block px-2.5 py-0.5 bg-indigo-50 rounded-xl border border-indigo-100 font-extrabold">{t.num} / {t.den}</span>;

        switch (t.shape) {
          case 'pizza':
            return isColor ? (
              <span>Belege genau {numDisplay} der Pizza mit leckerer Salami!</span>
            ) : (
              <span>Welcher Anteil dieser Pizza ist mit Salami belegt?</span>
            );
          case 'choco':
            return isColor ? (
              <span>Gieße genau {numDisplay} flüssige Schokolade in die Behälter!</span>
            ) : (
              <span>Welcher Anteil der Behälter ist mit Schokolade gefüllt?</span>
            );
          case 'meadow':
            return isColor ? (
              <span>Pflanze genau {numDisplay} Tulpen auf der Wiese an!</span>
            ) : (
              <span>Welcher Anteil der Blumen auf der Wiese sind Tulpen?</span>
            );
          case 'glass':
            return isColor ? (
              <span>Fülle das Wasserglas genau bis zur Markierung {numDisplay} voll!</span>
            ) : (
              <span>Wie voll ist das Wasserglas? Trage den passenden Bruch ein.</span>
            );
          default:
            return "";
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          {overallSuccess && <ConfettiExplosion />}

          {/* Header */}
          <header className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <div className="flex items-center gap-3">
              <div className="bg-gradient-to-tr from-indigo-500 to-purple-600 p-2.5 rounded-2xl shadow-md shadow-indigo-100 text-white">
                <Icon name="sparkles" className="w-8 h-8 animate-pulse" />
              </div>
              <div>
                <h1 className="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 tracking-tight">
                  Bruch-Entdecker Studio
                </h1>
                <p className="text-slate-500 font-semibold text-xs">Ein interaktives Riesen-Arbeitsblatt mit 27 Übungen</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setIsMuted(!isMuted)} 
                title={isMuted ? "Ton einschalten" : "Ton stummschalten"}
                className={`p-2.5 rounded-xl border transition-all ${
                  isMuted 
                    ? 'bg-slate-100 border-slate-200 text-slate-400 hover:bg-slate-200' 
                    : 'bg-indigo-50 border-indigo-100 text-indigo-600 hover:bg-indigo-100'
                }`}
              >
                {isMuted ? <Icon name="volumex" className="w-5 h-5" /> : <Icon name="volume2" className="w-5 h-5" />}
              </button>

              <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100">
                <Icon name="star" className="w-5 h-5 fill-amber-400 text-amber-400" />
                <span className="font-extrabold text-slate-700 text-sm">Serie: {streak}</span>
              </div>
            </div>
          </header>

          {/* Progress Board */}
          <div className="bg-white rounded-3xl p-5 mb-4 border border-slate-100 shadow-sm">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 items-center">
              <div className="md:col-span-2">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-bold text-slate-700 text-sm sm:text-base flex items-center gap-2">
                    <span className="bg-indigo-50 p-1 rounded-lg text-indigo-600 inline-block">
                      <Icon name="check" className="w-3.5 h-3.5" />
                    </span>
                    Dein Gesamt-Arbeitsfortschritt
                  </span>
                  <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full">
                    {correctCount} von 27 gelöst
                  </span>
                </div>
                <div className="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden">
                  <div 
                    className="bg-gradient-to-r from-indigo-500 via-sky-500 to-emerald-500 h-full transition-all duration-500 ease-out"
                    style={{ width: `${(correctCount / 27) * 100}%` }}
                  />
                </div>
              </div>

              <div className="flex justify-around bg-slate-50 p-3 rounded-2xl border border-slate-100/70">
                <div className="flex flex-col items-center">
                  <Icon name="trophy" className={`w-6 h-6 ${correctCount >= 9 ? 'text-amber-600 drop-shadow' : 'text-slate-300'}`} />
                  <span className="text-[10px] font-bold mt-1 text-slate-500">Bronze (9)</span>
                </div>
                <div className="flex flex-col items-center">
                  <Icon name="trophy" className={`w-6 h-6 ${correctCount >= 18 ? 'text-slate-400 drop-shadow' : 'text-slate-300'}`} />
                  <span className="text-[10px] font-bold mt-1 text-slate-500">Silber (18)</span>
                </div>
                <div className="flex flex-col items-center">
                  <Icon name="trophy" className={`w-6 h-6 ${correctCount >= 27 ? 'text-amber-400 drop-shadow animate-bounce' : 'text-slate-300'}`} />
                  <span className="text-[10px] font-bold mt-1 text-slate-500">Gold (27)</span>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-slate-400 font-medium pt-2 border-t border-slate-100/80">
              <span>Du darfst jederzeit überspringen oder deine eigene Reihenfolge wählen!</span>
              <div className="flex gap-4">
                <button onClick={expandAll} className="text-indigo-600 hover:underline font-semibold flex items-center gap-1">
                  <Icon name="eye" className="w-3.5 h-3.5" /> Alle auf
                </button>
                <button onClick={collapseAll} className="text-indigo-600 hover:underline font-semibold flex items-center gap-1">
                  <Icon name="eyeoff" className="w-3.5 h-3.5" /> Alle zu
                </button>
                <button onClick={handleResetWorksheet} className="text-rose-600 hover:underline font-semibold flex items-center gap-1">
                  <Icon name="rotateccw" className="w-3 h-3" /> Zurücksetzen
                </button>
              </div>
            </div>
          </div>

          {/* Quick-Nav Sticky Bar */}
          <div className="sticky top-2 z-40 bg-white/95 backdrop-blur-md rounded-2xl p-2 mb-6 border border-indigo-100/50 shadow-md flex items-center justify-around gap-2 text-xs font-bold text-slate-600">
            <button onClick={() => scrollToRef(stage1Ref)} className="flex-1 py-1.5 px-2 rounded-xl text-center hover:bg-slate-100 transition-all flex flex-col sm:flex-row items-center justify-center gap-1">
              <span className="text-emerald-600">Stufe 1</span>
              <span className="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.2 rounded-full font-extrabold">{progressStufe1}/9</span>
            </button>
            <div className="h-4 w-[1px] bg-slate-200" />
            <button onClick={() => scrollToRef(stage2Ref)} className="flex-1 py-1.5 px-2 rounded-xl text-center hover:bg-slate-100 transition-all flex flex-col sm:flex-row items-center justify-center gap-1">
              <span className="text-amber-600">Stufe 2</span>
              <span className="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.2 rounded-full font-extrabold">{progressStufe2}/9</span>
            </button>
            <div className="h-4 w-[1px] bg-slate-200" />
            <button onClick={() => scrollToRef(stage3Ref)} className="flex-1 py-1.5 px-2 rounded-xl text-center hover:bg-slate-100 transition-all flex flex-col sm:flex-row items-center justify-center gap-1">
              <span className="text-rose-600">Stufe 3</span>
              <span className="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.2 rounded-full font-extrabold">{progressStufe3}/9</span>
            </button>
          </div>

          {/* 27 Tasks */}
          <div className="space-y-4 mb-8">
            {tasks.map((t, idx) => {
              const mLabel = getModelLabel(t.shape);
              const showLevelHeader = idx === 0 || idx === 9 || idx === 18;
              let levelHeaderContent = null;
              
              if (showLevelHeader) {
                if (idx === 0) {
                  levelHeaderContent = (
                    <div ref={stage1Ref} className="pt-2 pb-1 px-1 scroll-mt-20">
                      <span className="inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-wider text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-100">
                        🟢 Stufe 1: Brüche zeichnen & einfärben (1–9)
                      </span>
                    </div>
                  );
                } else if (idx === 9) {
                  levelHeaderContent = (
                    <div ref={stage2Ref} className="pt-6 pb-1 px-1 scroll-mt-20">
                      <span className="inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-wider text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-100">
                        🟡 Stufe 2: Brüche ablesen (10–18)
                      </span>
                    </div>
                  );
                } else if (idx === 18) {
                  levelHeaderContent = (
                    <div ref={stage3Ref} className="pt-6 pb-1 px-1 scroll-mt-20">
                      <span className="inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-wider text-rose-600 bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-100">
                        🔴 Stufe 3: Gemischte Profi-Aufgaben (19–27)
                      </span>
                    </div>
                  );
                }
              }

              return (
                <React.Fragment key={t.id}>
                  {levelHeaderContent}
                  
                  <div className={`bg-white rounded-3xl border transition-all duration-300 ${
                    t.status === 'correct' 
                      ? 'border-emerald-200 shadow-emerald-50/30 shadow-md bg-emerald-50/5' 
                      : t.status === 'incorrect' 
                        ? 'border-rose-200 shadow-rose-50/30 shadow-md' 
                        : 'border-slate-100 hover:border-slate-200 shadow-sm hover:shadow-md'
                  }`}>
                    
                    {/* Header */}
                    <div onClick={() => toggleCollapse(t.id)} className="flex items-center justify-between p-4 sm:p-5 cursor-pointer select-none">
                      <div className="flex items-center gap-3 flex-1 min-w-0">
                        {t.status === 'correct' ? (
                          <div className="bg-emerald-100 p-1.5 rounded-full text-emerald-600 shrink-0">
                            <Icon name="check" className="w-5 h-5" />
                          </div>
                        ) : t.status === 'incorrect' ? (
                          <div className="bg-rose-100 p-1.5 rounded-full text-rose-600 shrink-0">
                            <Icon name="xcircle" className="w-5 h-5" />
                          </div>
                        ) : (
                          <div className="w-8 h-8 rounded-full border-2 border-slate-200 flex items-center justify-center text-slate-400 font-bold text-xs shrink-0 bg-slate-50">
                            {t.id}
                          </div>
                        )}

                        <div className="min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <h3 className="font-extrabold text-sm sm:text-base text-slate-800">Aufgabe {t.id}</h3>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full tracking-wider ${mLabel.color}`}>
                              {mLabel.text}
                            </span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-3">
                        {t.isCollapsed ? <Icon name="chevrondown" /> : <Icon name="chevronup" />}
                      </div>
                    </div>

                    {/* Workspace */}
                    {!t.isCollapsed && (
                      <div className="p-4 sm:p-6 md:p-8 border-t border-slate-50 bg-slate-50/20 rounded-b-3xl">
                        <div className="text-center mb-6 max-w-xl mx-auto">
                          <h4 className="text-base sm:text-lg font-bold text-slate-800 leading-snug">
                            {getTaskPrompt(t)}
                          </h4>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center justify-center">
                          <div className={`p-4 bg-white rounded-2xl border border-slate-100 flex flex-col gap-3 items-center justify-center min-h-[250px] relative ${t.status === 'incorrect' ? 'shake' : ''}`}>
                            {t.shape === 'pizza' && <PizzaShape den={t.den} selectedSlices={t.selectedSlices} onSliceClick={(s) => handleSliceClick(t.id, s)} interactive={t.type === 'color'} taskId={t.id} />}
                            {t.shape === 'choco' && <ChocoShape den={t.den} selectedSlices={t.selectedSlices} onSliceClick={(s) => handleSliceClick(t.id, s)} interactive={t.type === 'color'} taskId={t.id} />}
                            {t.shape === 'meadow' && <FlowerMeadowShape den={t.den} selectedSlices={t.selectedSlices} onSliceClick={(s) => handleSliceClick(t.id, s)} interactive={t.type === 'color'} taskId={t.id} />}
                            {t.shape === 'glass' && <WaterGlassShape den={t.den} selectedSlices={t.selectedSlices} onSliceClick={(s) => handleSliceClick(t.id, s)} interactive={t.type === 'color'} taskId={t.id} />}
                            
                            {t.type === 'color' && t.status !== 'correct' && (
                              <div className="flex gap-2 text-[10px] text-slate-400 pt-2">
                                <button onClick={() => handleMassSelect(t.id, 'none')} className="px-2 py-1 bg-slate-50 hover:bg-slate-100 rounded-md border border-slate-100 font-medium">
                                  Auswahl leeren
                                </button>
                                <button onClick={() => handleMassSelect(t.id, 'all')} className="px-2 py-1 bg-indigo-50/50 hover:bg-indigo-50 rounded-md border border-indigo-100/30 text-indigo-600 font-semibold">
                                  Alles voll
                                </button>
                              </div>
                            )}
                          </div>

                          {/* Inputs/Check area */}
                          <div className="flex flex-col items-center justify-center w-full px-2">
                            {t.type === 'read' ? (
                              <div className="flex flex-col items-center bg-indigo-50/40 p-4 rounded-2xl border border-indigo-100/40 mb-4 w-full max-w-[200px]">
                                <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-3">Bruch eintragen</span>
                                <input 
                                  type="number" 
                                  value={t.inputNum}
                                  onChange={(e) => {
                                    setTasks(prev => prev.map(p => p.id === t.id ? { ...p, inputNum: e.target.value, status: 'idle' } : p));
                                  }}
                                  disabled={t.status === 'correct'}
                                  className="w-14 text-center text-2xl font-black text-indigo-600 bg-white border-2 border-slate-200 rounded-xl py-1.5 focus:outline-none"
                                  placeholder="?"
                                />
                                <div className="w-20 h-1.5 bg-slate-800 rounded-full my-3"></div>
                                <input 
                                  type="number" 
                                  value={t.inputDen}
                                  onChange={(e) => {
                                    setTasks(prev => prev.map(p => p.id === t.id ? { ...p, inputDen: e.target.value, status: 'idle' } : p));
                                  }}
                                  disabled={t.status === 'correct'}
                                  className="w-14 text-center text-2xl font-black text-slate-700 bg-white border-2 border-slate-200 rounded-xl py-1.5 focus:outline-none"
                                  placeholder="?"
                                />
                              </div>
                            ) : (
                              <div className="flex flex-col items-center bg-indigo-50/40 p-4 rounded-2xl mb-4 w-full max-w-[200px] border border-indigo-100/40">
                                <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-wider mb-2">Auswahl</span>
                                <div className="flex items-center gap-1 font-black">
                                  <div className="text-3xl text-indigo-600">{t.selectedSlices.length}</div>
                                  <div className="text-xl text-slate-300">/</div>
                                  <div className="text-2xl text-slate-500">{t.den}</div>
                                </div>
                              </div>
                            )}

                            <div className="w-full max-w-[200px]">
                              {t.status === 'correct' ? (
                                <div className="flex items-center justify-center gap-1.5 text-emerald-600 font-extrabold text-sm py-2.5 bg-emerald-50 rounded-xl border border-emerald-200 w-full animate-pulse">
                                  <Icon name="check" className="w-4 h-4" /> Gelöst!
                                </div>
                              ) : (
                                <div className="flex flex-col gap-2">
                                  <button onClick={() => checkIndividualTask(t.id)} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm px-6 py-2.5 rounded-xl shadow-md hover:scale-[1.02] active:scale-95 transition-all w-full justify-center">
                                    Überprüfen
                                  </button>
                                  <button onClick={() => toggleHint(t.id)} className="text-indigo-500 hover:text-indigo-600 text-xs font-bold py-1 flex items-center justify-center gap-1">
                                    <Icon name="lightbulb" className="w-3.5 h-3.5" /> 
                                    {t.showHint ? "Tipp ausblenden" : "Tipp verraten"}
                                  </button>
                                </div>
                              )}

                              {t.showHint && t.status !== 'correct' && (
                                <div className="mt-2 bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-3 text-[11px] leading-relaxed">
                                  <strong>💡 Tipp:</strong> {getDidacticHint(t)}
                                </div>
                              )}

                              {t.feedbackMsg && (
                                <div className={`mt-3 text-center font-bold px-3 py-2 rounded-xl text-xs border ${
                                  t.status === 'correct' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800 animate-pulse'
                                }`}>
                                  {t.feedbackMsg}
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </React.Fragment>
              );
            })}
          </div>

          {/* Info Block */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-white border border-slate-100 p-5 rounded-3xl shadow-sm flex gap-3 items-start">
              <div className="bg-sky-100 p-2 rounded-xl text-sky-600 shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </div>
              <div>
                <h4 className="font-bold text-slate-800 text-xs mb-1">Zähler & Nenner Kurztipp</h4>
                <p className="text-slate-500 text-[11px] leading-relaxed">
                  Der <strong>Nenner (unten)</strong> beschreibt, in wie viele gleich große Teile geteilt wurde. <br/>
                  Der <strong>Zähler (oben)</strong> bestimmt, wie viele dieser Teile wir betrachten.
                </p>
              </div>
            </div>

            <div className="bg-white border border-slate-100 p-5 rounded-3xl shadow-sm flex gap-3 items-start">
              <div className="bg-emerald-100 p-2 rounded-xl text-emerald-600 shrink-0">
                <Icon name="helpcircle" className="w-4 h-4" />
              </div>
              <div>
                <h4 className="font-bold text-slate-800 text-xs mb-1">Spielregeln für Profis</h4>
                <p className="text-slate-500 text-[11px] leading-relaxed">
                  Schalte bei 9, 18 und 27 gelösten Aufgaben glänzende Medaillen frei. Nutze bei schweren Fragen den gelben Tipp!
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
